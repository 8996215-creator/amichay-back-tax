<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>עושים החזר - המדינה לוקחת, אנחנו מחזירים</title>
  </head>
  <body>
    <!-- Netlify Forms Crawl Targets (Hidden) -->
    <form name="tax-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="form-name" value="tax-lead" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="taxYear" />
      <input type="number" name="estimate" />
      <input type="text" name="isMiloimnik" />
      <input type="text" name="comments" />
      <input type="text" name="extraDetails" />
    </form>

    <form name="advanced-file-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="form-name" value="advanced-file-lead" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="taxYear" />
      <input type="text" name="comments" />
      <input type="text" name="attachmentsList" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
